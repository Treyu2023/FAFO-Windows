<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reports and Logs</title>
  <style>
    body { margin: 0; background: #0e0e0c; color: #f3f1ea; font: 16px/1.45 "Segoe UI", sans-serif; }
    main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    p, pre { color: #a39e93; }
    input, button { height: 2.75rem; font: inherit; }
    input { width: 100%; background: #171714; color: #f3f1ea; border: 1px solid #2e2e27; border-radius: 8px; padding: 0 0.75rem; }
    button { margin-top: 0.5rem; background: #f3f1ea; color: #14130f; border: 0; border-radius: 8px; padding: 0 1rem; cursor: pointer; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Reports and Logs</h1>
    <p>Opens one text file. The file is not changed.</p>
    <input id="path" placeholder="C:\path\to\log.txt" />
    <button id="go" type="button">Open</button>
    <p id="note"></p>
    <pre id="out"></pre>
  </main>
  <script>
    document.querySelector("#go").onclick = async () => {
      const body = await (await fetch("/api/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: document.querySelector("#path").value }) })).json();
      document.querySelector("#note").textContent = body.error || body.name;
      document.querySelector("#out").textContent = body.error ? "" : (body.lines || []).slice(0, 400).join("\n");
    };
  </script>
</body>
</html>
